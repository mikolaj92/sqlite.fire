[project]
name = "sqlite-fire"
version = "0.1.2"
description = "Direct SQLite access from Mojo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "mikolaj92" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_fire"]

[tool.lokay]
test = "pixi run test"
